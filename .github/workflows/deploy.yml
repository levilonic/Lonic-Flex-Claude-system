name: LonicFLex Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target environment"
        required: true
        default: staging
        type: choice
        options:
          - development
          - staging
          - production
      strategy:
        description: "Deployment strategy"
        required: true
        default: rolling
        type: choice
        options:
          - rolling
          - blue-green
          - canary
          - recreate
      image-tag:
        description: "Docker image tag"
        required: true
        default: latest
      run-tests:
        description: "Run smoke tests before building"
        required: true
        default: true
        type: boolean
      dry-run:
        description: "Skip deployment execution (build and package only)"
        required: true
        default: true
        type: boolean

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  branch-guard:
    name: Deployment Branch Guard
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.branch-check.outputs.should-run }}
    steps:
      - name: Determine deployment eligibility
        id: branch-check
        run: |
          BRANCH="${{ github.ref }}"
          EVENT="${{ github.event_name }}"
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$BRANCH" == "refs/heads/main" || "$BRANCH" == "refs/heads/master" || "$BRANCH" == "refs/heads/foundation-v0" ]]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip notice
        if: steps.branch-check.outputs.should-run != 'true'
        run: echo "Skipping deployment workflow for branch ${{ github.ref }}"

  build-artifact:
    name: Build Artifact
    runs-on: ubuntu-latest
    needs: branch-guard
    if: needs.branch-guard.outputs.should-run == 'true'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: lonicflex-multi-agent
      IMAGE_TAG: ${{ inputs.image-tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        if: inputs.run-tests == true
        run: npm run test:smoke
        env:
          CI: true

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Save Docker image as artifact
        run: docker save $IMAGE_NAME:$IMAGE_TAG | gzip > lonicflex-image.tar.gz

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: lonicflex-image
          path: lonicflex-image.tar.gz
          retention-days: 7

  deploy:
    name: Deploy
    needs: build-artifact
    runs-on: ubuntu-latest
    if: needs.build-artifact.result == 'success'
    permissions:
      contents: read
      packages: write
    environment:
      name: ${{ inputs.environment }}
    env:
      IMAGE_NAME: lonicflex-multi-agent
      IMAGE_TAG: ${{ inputs.image-tag }}
      DEPLOY_ENV: ${{ inputs.environment }}
      DEPLOY_STRATEGY: ${{ inputs.strategy }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      BACKUP_ENABLED: ${{ vars.BACKUP_ENABLED || 'true' }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: lonicflex-image

      - name: Load Docker image
        run: gunzip -c lonicflex-image.tar.gz | docker load

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install runtime dependencies
        run: npm ci

      - name: Docker registry login
        if: inputs.dry-run == false && secrets.DOCKER_REGISTRY != '' && secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image to registry
        if: inputs.dry-run == false && secrets.DOCKER_REGISTRY != ''
        run: |
          docker tag $IMAGE_NAME:$IMAGE_TAG ${{ secrets.DOCKER_REGISTRY }}/$IMAGE_NAME:$IMAGE_TAG
          docker push ${{ secrets.DOCKER_REGISTRY }}/$IMAGE_NAME:$IMAGE_TAG

      - name: Deployment dry run summary
        if: inputs.dry-run == true
        run: |
          echo "Dry run enabled. Skipping deployment execution."
          echo "Docker image available as artifact 'lonicflex-image'."

      - name: Execute deployment
        if: inputs.dry-run == false
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
          IMAGE_NAME: lonicflex-multi-agent
          ENVIRONMENT: ${{ inputs.environment }}
          STRATEGY: ${{ inputs.strategy }}
          GITHUB_TOKEN: ${{ secrets.DEPLOY_GITHUB_TOKEN || github.token }}
        run: |
          chmod +x scripts/deploy.sh
          scripts/deploy.sh "$ENVIRONMENT" "$STRATEGY"

      - name: Capture deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs-${{ inputs.environment }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

