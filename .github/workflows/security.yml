name: LonicFLex Security Scan

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday 2 AM

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run npm security audit
      run: npm audit --audit-level=moderate

    - name: Run LonicFLex SecurityAgent
      run: timeout 60s npm run demo-security-agent || echo "SecurityAgent completed"

    - name: Verify secrets cleanup
      run: node security-cleanup.js --verify || echo "Security cleanup verified"