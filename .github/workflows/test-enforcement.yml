name: Test Enforcement - MANDATORY

on:
  push:
    branches: [ main, foundation-v0, develop ]
  pull_request:
    branches: [ main, foundation-v0, develop ]

jobs:
  enforce-tests:
    name: Enforce 100% Test Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm test
        env:
          CI: true

      - name: Verify all agents load and instantiate
        run: npm run verify-agents

      - name: Analyze test coverage
        run: npm run test:coverage

      - name: Enforce coverage threshold
        run: npm run test:enforce

      - name: Tests passed - PR approved
        if: success()
        run: |
          echo "ALL CHECKS PASSED!"
          echo "Tests: PASSING"
          echo "Coverage: 100%"
          echo "No untested files"
          echo "PR is safe to merge!"

      - name: Tests failed - PR blocked
        if: failure()
        run: |
          echo "CHECKS FAILED - PR BLOCKED!"
          echo "Fix issues before merging!"
          exit 1
