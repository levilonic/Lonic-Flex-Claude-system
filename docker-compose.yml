version: '3.8'

services:
  # LonicFlex Master Service - Port 3007
  lonicflex-master:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=production
      - PORT=3007
      - SERVICE_NAME=lonicflex-master
      - LONICFLEX_MODE=master
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
    command: ["node", "services/lonicflex-master-service.js"]
    networks:
      - lonicflex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - lonicflex-health
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # LonicFlex Webhooks Service - Port 3008
  lonicflex-webhooks:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3008:3008"
    environment:
      - NODE_ENV=production
      - PORT=3008
      - SERVICE_NAME=lonicflex-webhooks
      - LONICFLEX_MODE=webhooks
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
    command: ["node", "services/lonicflex-webhook-service.js"]
    networks:
      - lonicflex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - lonicflex-master
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # LonicFlex GitHub Service - Port 3002
  lonicflex-github:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - SERVICE_NAME=lonicflex-github
      - LONICFLEX_MODE=github
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
    command: ["node", "services/lonicflex-github-service.js"]
    networks:
      - lonicflex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # LonicFlex Agents Service - Port 3003
  lonicflex-agents:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - SERVICE_NAME=lonicflex-agents
      - LONICFLEX_MODE=agents
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
    command: ["node", "services/lonicflex-agents-service.js"]
    networks:
      - lonicflex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # LonicFlex Workflows Service - Port 3004
  lonicflex-workflows:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
      - SERVICE_NAME=lonicflex-workflows
      - LONICFLEX_MODE=workflows
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
    command: ["node", "services/lonicflex-workflows-service.js"]
    networks:
      - lonicflex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # LonicFlex Health Service - Port 3005
  lonicflex-health:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - SERVICE_NAME=lonicflex-health
      - LONICFLEX_MODE=health
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
    command: ["node", "services/lonicflex-health-service.js"]
    networks:
      - lonicflex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # LonicFlex Slack Service - Port 3006
  lonicflex-slack:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      - PORT=3006
      - SERVICE_NAME=lonicflex-slack
      - LONICFLEX_MODE=slack
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
    command: ["node", "services/lonicflex-slack-service.js"]
    networks:
      - lonicflex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Optional: Dashboard Service - Port 3001 (Disabled - file doesn't exist)
  # lonicflex-dashboard:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   ports:
  #     - "3001:3001"
  #   environment:
  #     - NODE_ENV=production
  #     - PORT=3001
  #     - DASHBOARD_MODE=true
  #   volumes:
  #     - ./logs:/app/logs
  #   command: ["node", "monitoring/dashboard-server.js"]
  #   networks:
  #     - lonicflex-network
  #   restart: unless-stopped
  #   depends_on:
  #     - lonicflex-health
  #     - lonicflex-master
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 500M
  #         cpus: '0.5'

  # Nginx reverse proxy for external access
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - lonicflex-master
      - lonicflex-webhooks
      - lonicflex-github
      - lonicflex-agents
      - lonicflex-workflows
      - lonicflex-health
      - lonicflex-slack
    networks:
      - lonicflex-network
    restart: unless-stopped

networks:
  lonicflex-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  lonicflex-logs:
  lonicflex-database: